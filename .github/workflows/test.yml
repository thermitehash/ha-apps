name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HYPOTHESIS_PROFILE: ci
    defaults:
      run:
        working-directory: pantry-hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pantry-hub/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests with coverage (core service ≥ 90%)
        run: >-
          python -m pytest -q -o faulthandler_timeout=300
          --cov=pantry_hub --cov-branch --cov-report=term-missing
          --cov-fail-under=90
