name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HYPOTHESIS_PROFILE: ci
    defaults:
      run:
        working-directory: pantry-hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pantry-hub/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Tests with coverage (core service ≥ 90%)
        run: >-
          python -m pytest -q -o faulthandler_timeout=300
          --cov=pantry_hub --cov-branch --cov-report=term-missing
          --cov-fail-under=90

  # The macOS flake in test_sweep_now_during_continuous_then_resumes was
  # FakeUR4 accepting connections late under kqueue (fixed in aiochainway
  # v0.3.0). Run it 200 times with its original 8 s wait to confirm.
  macos-repeat:
    name: Sweep-now repeat ×200 (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pantry-hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pantry-hub/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: test_sweep_now_during_continuous_then_resumes × 200
        run: >-
          python -m pytest -q -o faulthandler_timeout=300
          "tests/test_door_reading.py::test_sweep_now_during_continuous_then_resumes"
          --count=200 -x -p no:randomly
