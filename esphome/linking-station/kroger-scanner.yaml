# Linking station: the Kroger Restock wall scanner (M5Stack AtomS3 Lite +
# Atomic QRCode2 Base) with an M5Stack Unit UHF-RFID (U107) on the Grove port.
#
# It keeps the wall scanner's device name (kroger-scanner), its HA feedback
# action (esphome.kroger_scanner_feedback) and its Kroger behaviour, and adds
# a link mode for Pantry Hub.
#
# Kroger mode (default, LED off when idle — unchanged from the wall scanner):
#   barcode → kroger_restock.scan_upc (source: esphome); HA's feedback
#   automation lights the result (green / amber / blue / red).
#   Button: short press = print list, hold 1–6 s = sync cart.
#
# Link mode (button double-click; LED slowly pulses dim blue; leaves after
# 60 s idle or another double-click, with a short cyan flash):
#   barcode → MQTT pantry_hub/linking/<station_id>/barcode, then the U107
#   polls for up to 15 s and publishes the strongest tag to .../tag. The
#   hub's .../result shows as: green = linked, amber = unknown barcode,
#   magenta = tag already linked, red = error / timeout.
#   In-stock session: in link mode, scan the printed mode card (QR
#   "PANTRY-HUB:IN-STOCK", docs/mode-card-in-stock.pdf) to toggle it. The
#   pulse turns dim amber and every link is sent with "in_stock": true (Grocy
#   already counts the unit). It ends with link mode or a second card scan.
#   The U107 radio only transmits during that scan (the module sleeps
#   otherwise), so the wall scanner never reads tagged items nearby.
#
# After adopting: Settings → Devices & services → ESPHome → (this device) →
# Configure → turn on "Allow the device to perform Home Assistant actions".
#
# Pins: QRCode2 base G5 (base TX → Atom RX), G6 (Atom TX → base RX), G7 TRIG,
# G8 LED; U107 on Grove G1/G2. See README.md.

substitutions:
  name: kroger-scanner
  friendly_name: Kroger Scanner
  station_id: kroger_scanner # MQTT topic segment; [A-Za-z0-9_-], max 32
  # QRCode2 base on the AtomS3 bottom header.
  scanner_rx_pin: GPIO5
  scanner_tx_pin: GPIO6
  scanner_trig_pin: GPIO7 # pulse-trigger mode only; unused in auto mode
  scanner_led_pin: GPIO8 # base illumination LED; driven by the M14 itself
  scan_mode: "0x02" # M14: 0x02 auto (continuous), 0x05 motion sensing
  # U107 on the Grove port. If no tag is ever read, swap these two.
  u107_rx_pin: GPIO1 # Atom RX ← U107 TX
  u107_tx_pin: GPIO2 # Atom TX → U107 RX
  u107_tx_power_dbm: "15" # low, so only the item in hand is read
  link_tag_timeout_ms: "15000"
  link_idle_timeout_ms: "60000"
  # Counted session: wait this long for each tap (the hub ends it after 60 s).
  link_counted_timeout_ms: "60000"
  # M14 beep command tried after link results when "Link result beep" is on.
  # Unverified: the M14's documented UART command is "beep on decode"
  # (21 63 42 01); no direct buzzer command is known. See README.
  m14_beep_cmd: "0x21, 0x63, 0x42, 0x01"
  rgb_led_pin: GPIO35
  button_pin: GPIO41

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: thermitehash.pantry_linking_station
    version: "0.4.1"
  includes:
    - include/link_mode.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - script.execute: configure_scanner

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

# Logs go over USB-CDC; both hardware UARTs are free for the scanner + U107.
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret kroger_scanner_api_key
  actions:
    # Kroger feedback, unchanged (called by HA on kroger_restock_scanned).
    - action: feedback
      variables:
        result: string
      then:
        - lambda: |-
            if (result == "in_cart" || result == "duplicate") {
              id(show_color).execute(0.0f, 1.0f, 0.0f);
            } else if (result == "waiting") {
              id(show_color).execute(1.0f, 0.55f, 0.0f);
            } else if (result == "ignored") {
              id(blink_ignored).execute();
            } else if (result == "needs_review") {
              id(show_color).execute(0.0f, 0.3f, 1.0f);
            } else {
              id(show_color).execute(1.0f, 0.0f, 0.0f);
            }

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret kroger_scanner_fallback_password

captive_portal:

# MQTT only for the Pantry Hub linking topics. Discovery is off so HA keeps
# using the native API entities (no duplicates).
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  log_topic: null
  topic_prefix: pantry_hub/stations/${station_id}
  on_json_message:
    - topic: pantry_hub/linking/${station_id}/result
      then:
        - lambda: |-
            std::string status = x["status"] | "error";
            int remaining = x["remaining"] | -1;
            ESP_LOGI("link", "Hub result: %s", status.c_str());
            id(touch_link_mode).execute();
            id(link_result).execute(status);
            // Counted session: scan for the next tag while some remain.
            if (link_mode::state().on_result(status, remaining)) {
              ESP_LOGI("link", "Counted session: %d to go", remaining);
              id(counted_next_tag).execute();
            }
    # Pantry Hub's web UI started / stopped Unload or Stock-take.
    - topic: pantry_hub/linking/${station_id}/mode
      then:
        - lambda: |-
            std::string mode = x["mode"] | "";
            if (link_mode::state().set_mode_from_hub(mode)) {
              ESP_LOGI("link", "Mode from Pantry Hub: %s", link_mode::state().mode_name());
              id(touch_link_mode).execute();
              id(link_idle_led).execute();
            }
    # Pantry Hub "Just bought" → Tag them: link up to `count` tags, one per
    # tap, to the product with this barcode (same blue pulse as link mode).
    - topic: pantry_hub/linking/${station_id}/start
      then:
        - lambda: |-
            int count = x["count"] | 0;
            std::string barcode = x["barcode"] | "";
            if (!link_mode::state().start_counted(count)) {
              ESP_LOGW("link", "Ignoring start without a count");
              return;
            }
            ESP_LOGI("link", "Counted session: tag %d × %s", count, barcode.c_str());
            id(last_barcode).publish_state(barcode);
            id(touch_link_mode).execute();
            id(link_idle_led).execute();
            id(u107).start_scan(${link_counted_timeout_ms});

time:
  - platform: homeassistant
    id: ha_time

# Kroger / link mode and the in-stock session live in include/link_mode.h
# (link_mode::state()).
globals:
  - id: link_last_activity
    type: uint32_t
    initial_value: "0"

uart:
  - id: scanner_uart
    rx_pin: ${scanner_rx_pin}
    tx_pin: ${scanner_tx_pin}
    baud_rate: 115200
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\r"
        timeout: 20ms
      sequence:
        - lambda: |-
            // Classification and mode handling live in include/link_mode.h
            // (unit-tested on the host).
            auto scan = link_mode::classify(std::string(bytes.begin(), bytes.end()));
            switch (link_mode::state().on_scan(scan)) {
              case link_mode::Action::KROGER_SCAN:
                id(last_barcode).publish_state(scan.code);
                id(send_scan).execute(scan.code);
                break;
              case link_mode::Action::LINK_BARCODE:
                id(last_barcode).publish_state(scan.code);
                id(link_barcode).execute(scan.code);
                break;
              case link_mode::Action::UNLOAD_BARCODE:
              case link_mode::Action::STOCKTAKE_BARCODE:
                // Never kroger_restock.scan_upc: Pantry Hub only.
                id(last_barcode).publish_state(scan.code);
                id(scan_to_hub).execute(scan.code);
                break;
              case link_mode::Action::SESSION_ON:
                ESP_LOGI("link", "In-stock session on: links skip the next Grocy add");
                id(touch_link_mode).execute();
                id(link_idle_led).execute();
                break;
              case link_mode::Action::SESSION_OFF:
                ESP_LOGI("link", "In-stock session off");
                id(touch_link_mode).execute();
                id(link_idle_led).execute();
                break;
              case link_mode::Action::CARD_OUTSIDE_LINK:
                ESP_LOGI("link", "In-stock card ignored: double-click for link mode first");
                id(blink_ignored).execute();
                break;
              case link_mode::Action::IGNORED:
              default:
                ESP_LOGD("scanner", "Ignoring non-product code");
                id(blink_ignored).execute();
                break;
            }
  - id: u107_uart
    rx_pin: ${u107_rx_pin}
    tx_pin: ${u107_tx_pin}
    baud_rate: 115200

jrd4035:
  id: u107
  uart_id: u107_uart
  tx_power: ${u107_tx_power_dbm}
  region: US
  rssi_window: 1s
  on_tag:
    - lambda: |-
        ESP_LOGI("link", "Tag %s (%.0f dBm)", epc.c_str(), rssi);
        id(last_tag).publish_state(epc);
    - mqtt.publish_json:
        topic: pantry_hub/linking/${station_id}/tag
        payload: |-
          root["epc"] = epc;
          root["rssi"] = rssi;
          root["ts"] = id(ha_time).now().is_valid() ? id(ha_time).now().timestamp : 0;
          if (link_mode::state().in_stock()) root["in_stock"] = true;
  on_timeout:
    - logger.log: "No tag read; the hub will report a timeout"

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin: ${rgb_led_pin}
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: link_pulse
          transition_length: 1s
          update_interval: 1s
          min_brightness: 5%
          max_brightness: 35%
      # Unload (green) and Stock-take (amber): a slower pulse.
      - pulse:
          name: slow_pulse
          transition_length: 2500ms
          update_interval: 2500ms
          min_brightness: 5%
          max_brightness: 40%

text_sensor:
  - platform: template
    id: last_barcode
    name: Last barcode
    icon: mdi:barcode-scan
  - platform: template
    id: last_tag
    name: Last linked tag
    icon: mdi:tag

binary_sensor:
  - platform: gpio
    id: atom_button
    name: Button
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_multi_click:
      # Triple-click: Unload mode (again: back to Kroger mode).
      - timing:
          - ON for at most 0.7s
          - OFF for at most 0.35s
          - ON for at most 0.7s
          - OFF for at most 0.35s
          - ON for at most 0.7s
          - OFF for at least 0.4s
        then:
          - script.execute: { id: button_gesture, gesture: 3 }
      # Double-click: toggle link mode (waits 0.4 s to rule out a third click).
      - timing:
          - ON for at most 0.7s
          - OFF for at most 0.35s
          - ON for at most 0.7s
          - OFF for at least 0.4s
        then:
          - script.execute: { id: button_gesture, gesture: 2 }
      # Single short press (waits ~400 ms to rule out a double-click): print,
      # or leave Unload / Stock-take.
      - timing:
          - ON for 30ms to 0.7s
          - OFF for at least 0.4s
        then:
          - script.execute: { id: button_gesture, gesture: 1 }
      # Hold 6 s: Stock-take mode (again: back to Kroger mode).
      - timing:
          - ON for at least 6s
        then:
          - script.execute: { id: button_gesture, gesture: 4 }
      # Hold 1–6 s: sync the cart.
      - timing:
          - ON for 1s to 6s
          - OFF for at least 0.2s
        then:
          - script.execute: sync_cart
  - platform: template
    id: in_stock_session_sensor
    name: In-stock session
    icon: mdi:package-variant-closed-check
    lambda: return link_mode::state().in_stock();
  - platform: template
    id: link_mode_sensor
    name: Link mode
    icon: mdi:link-variant
    lambda: return link_mode::state().link_mode();

number:
  - platform: template
    id: tag_tap_pause
    name: Tag tap pause
    icon: mdi:timer-sand
    unit_of_measurement: s
    min_value: 1
    max_value: 4
    step: 0.5
    initial_value: 1.5
    optimistic: true
    restore_value: true
    entity_category: config
    mode: box

switch:
  - platform: template
    id: link_beep
    name: Link result beep (unverified)
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              uint32_t timeout = link_mode::state().idle_timeout_ms();
              return timeout > 0 && !id(u107).is_scanning() &&
                     millis() - id(link_last_activity) > timeout;
          then:
            - lambda: |-
                ESP_LOGI("link", "%s mode idle; back to Kroger mode",
                         link_mode::state().mode_name());
            - script.execute: exit_link_mode

script:
  - id: configure_scanner
    then:
      - uart.write:
          id: scanner_uart
          data: !lambda "return {0x21, 0x61, 0x41, ${scan_mode}};"
      - delay: 100ms
      - uart.write:
          id: scanner_uart
          data: [0x21, 0x63, 0x42, 0x01]
      - delay: 100ms
      - uart.write:
          id: scanner_uart
          data: [0x21, 0x64, 0x82, 0x05, 0xDC]

  # ---- Kroger mode (unchanged) ------------------------------------------
  - id: send_scan
    mode: queued
    parameters:
      code: string
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.scan_upc
                data:
                  upc: !lambda "return code;"
                  source: esphome
          else:
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  - id: print_receipt
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.print_list
                data:
                  target: receipt
            - script.execute: { id: show_color, r: 1.0, g: 1.0, b: 1.0 }
          else:
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  - id: sync_cart
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.action:
                action: kroger_restock.sync
            - script.execute: { id: show_color, r: 0.0, g: 1.0, b: 1.0 }
          else:
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  # ---- Link mode ----------------------------------------------------------
  - id: toggle_link_mode
    then:
      - if:
          condition:
            lambda: return link_mode::state().link_mode();
          then:
            - script.execute: exit_link_mode
          else:
            - script.execute: enter_link_mode

  - id: enter_link_mode
    then:
      - lambda: link_mode::state().enter_link();
      - script.execute: touch_link_mode
      - logger.log: "Link mode on"
      - script.execute: link_idle_led
      - script.execute: publish_mode_state

  # Button gestures (1 single, 2 double, 3 triple, 4 hold 6 s); the mode
  # logic is link_mode::State::on_click (host-tested).
  - id: button_gesture
    mode: queued
    parameters:
      gesture: int
    then:
      - lambda: |-
          using link_mode::Click;
          using link_mode::ClickAction;
          Click c = gesture == 1 ? Click::SINGLE : gesture == 2 ? Click::DOUBLE
                  : gesture == 3 ? Click::TRIPLE : Click::LONG;
          if (c == Click::SINGLE && link_mode::state().mode() != link_mode::Mode::UNLOAD &&
              link_mode::state().mode() != link_mode::Mode::STOCKTAKE) {
            id(print_receipt).execute();
            return;
          }
          if (c == Click::DOUBLE) {
            // Keeps the old exit flash and U107 stop when link mode ends.
            if (link_mode::state().link_mode()) id(exit_link_mode).execute();
            else id(enter_link_mode).execute();
            return;
          }
          ClickAction a = link_mode::state().on_click(c);
          if (a == ClickAction::EXIT_MODE) {
            id(exit_link_mode).execute();
            return;
          }
          ESP_LOGI("link", "%s mode on", link_mode::state().mode_name());
          id(touch_link_mode).execute();
          id(link_idle_led).execute();
          id(publish_mode_state).execute();

  - id: publish_mode_state
    then:
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish_json:
                topic: pantry_hub/linking/${station_id}/mode_state
                payload: |-
                  root["mode"] = link_mode::state().mode_name();

  # Unload / Stock-take: the barcode goes to Pantry Hub only (never the
  # Kroger cart); the hub answers on .../result (green added/counted, amber
  # unknown barcode, red error).
  - id: scan_to_hub
    mode: queued
    parameters:
      code: string
    then:
      - script.execute: touch_link_mode
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish_json:
                topic: pantry_hub/linking/${station_id}/scan
                payload: |-
                  root["barcode"] = code;
                  root["mode"] = link_mode::state().mode_name();
                  root["ts"] = id(ha_time).now().is_valid() ? id(ha_time).now().timestamp : 0;
          else:
            - logger.log: "MQTT not connected; scan not sent"
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  - id: exit_link_mode
    then:
      - lambda: |-
          id(u107).stop_scan();
          link_mode::state().exit_link();  // also ends any in-stock session
      - logger.log: "Back to Kroger mode"
      - script.execute: publish_mode_state
      # Visible exit: one quick cyan flash, then LED off (Kroger idle).
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 0.0
          green: 1.0
          blue: 1.0
          effect: none
      - delay: 250ms
      - light.turn_off: status_led

  - id: touch_link_mode
    then:
      - globals.set:
          id: link_last_activity
          value: !lambda "return millis();"

  # Link mode: dim blue pulse; with an in-stock session: dim amber pulse.
  - id: link_idle_led
    mode: restart
    then:
      - if:
          condition:
            lambda: return link_mode::state().idle_color().on && link_mode::state().idle_color().slow;
          then:
            - light.turn_on:
                id: status_led
                red: !lambda "return link_mode::state().idle_color().r;"
                green: !lambda "return link_mode::state().idle_color().g;"
                blue: !lambda "return link_mode::state().idle_color().b;"
                effect: slow_pulse
          else:
            - if:
                condition:
                  lambda: return link_mode::state().idle_color().on;
                then:
                  - light.turn_on:
                      id: status_led
                      red: !lambda "return link_mode::state().idle_color().r;"
                      green: !lambda "return link_mode::state().idle_color().g;"
                      blue: !lambda "return link_mode::state().idle_color().b;"
                      effect: link_pulse

  - id: link_barcode
    mode: restart
    parameters:
      code: string
    then:
      - script.execute: touch_link_mode
      - if:
          condition:
            mqtt.connected:
          then:
            - mqtt.publish_json:
                topic: pantry_hub/linking/${station_id}/barcode
                payload: |-
                  root["barcode"] = code;
                  root["ts"] = id(ha_time).now().is_valid() ? id(ha_time).now().timestamp : 0;
                  if (link_mode::state().in_stock()) root["in_stock"] = true;
            - lambda: |-
                // Poll the U107 for up to link_tag_timeout.
                id(u107).start_scan(${link_tag_timeout_ms});
          else:
            - logger.log: "MQTT not connected; cannot link"
            - script.execute: { id: show_color, r: 1.0, g: 0.0, b: 0.0 }

  - id: link_result
    mode: restart
    parameters:
      status: string
    then:
      - lambda: |-
          id(u107).stop_scan();
          int beeps = 0;
          if (status == "linked" || status == "added" || status == "counted") {
            id(show_color).execute(0.0f, 1.0f, 0.0f);        // green
            beeps = 1;
          } else if (status == "unknown_barcode") {
            id(show_color).execute(1.0f, 0.55f, 0.0f);       // amber
            beeps = 2;
          } else if (status == "tag_already_linked") {
            id(show_color).execute(1.0f, 0.0f, 1.0f);        // magenta
            beeps = 2;
          } else {
            id(show_color).execute(1.0f, 0.0f, 0.0f);        // red: error / timeout
            beeps = 3;
          }
          if (id(link_beep).state) id(link_beep_script).execute(beeps);

  # Counted session: after a result, let the LED show it, then scan again
  # (one tag per tap: the tag just linked has usually left the antenna).
  - id: counted_next_tag
    mode: restart
    then:
      # "Tag tap pause" (1–4 s, default 1.5 s): time for the tag just linked
      # to leave the antenna before the next scan.
      - delay: !lambda "return (uint32_t) (id(tag_tap_pause).state * 1000);"
      - if:
          condition:
            lambda: return link_mode::state().counted();
          then:
            - script.execute: touch_link_mode
            - lambda: id(u107).start_scan(${link_counted_timeout_ms});

  - id: link_beep_script
    mode: restart
    parameters:
      count: int
    then:
      - repeat:
          count: !lambda "return count;"
          then:
            - uart.write:
                id: scanner_uart
                data: !lambda "return {${m14_beep_cmd}};"
            - delay: 150ms

  - id: blink_ignored
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on:
                id: status_led
                brightness: 60%
                red: 1.0
                green: 0.55
                blue: 0.0
                effect: none
            - delay: 200ms
            - light.turn_off: status_led
            - delay: 200ms
      - script.execute: link_idle_led

  # Show a colour for 1.5 s, then go back to the mode's idle look
  # (off in Kroger mode, blue pulse in link mode).
  - id: show_color
    mode: restart
    parameters:
      r: float
      g: float
      b: float
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: !lambda "return r;"
          green: !lambda "return g;"
          blue: !lambda "return b;"
          effect: none
      - delay: 1500ms
      - light.turn_off: status_led
      - script.execute: link_idle_led
