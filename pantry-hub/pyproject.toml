[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "pantry-hub"
dynamic = ["version"]
description = "RFID pantry inventory: Chainway UR4 reads become Grocy stock, with a barcode + RFID linking station."
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "thermitehash" }]
dependencies = [
    "aiochainway @ git+https://github.com/thermitehash/aiochainway@v0.2.0",
    "aiohttp==3.14.5",
    "aiomqtt==2.5.1",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
    "amqtt==0.12.2",
    "hypothesis==6.170.17",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "yamllint==1.38.0",
]

[project.scripts]
pantry-hub = "pantry_hub.__main__:main"

# The app version is single-sourced in config.yaml (what Home Assistant reads).
[tool.hatch.version]
source = "regex"
path = "config.yaml"
pattern = '^version: "(?P<version>[^"]+)"'

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pantry_hub"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RUF", "ASYNC", "PL", "TID", "D", "BLE", "S110", "S112"]
ignore = ["TID252", "ASYNC109", "RUF001", "RUF002", "RUF003", "E501", "D203", "D213", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLW0108", "ASYNC110", "ASYNC240", "ASYNC109", "D", "PLC0415", "PLR0917", "S101", "BLE001", "PLW0603"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["pantry_hub"]
combine-as-imports = true

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["amqtt.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::RuntimeWarning",
    "ignore::DeprecationWarning:amqtt.*",
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
source = ["pantry_hub"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "if __name__ == .__main__.:"]
