---
configuration:
  reader_host:
    name: Reader IP address
    description: The Chainway UR4's IP address (static, on the IoT VLAN).
  reader_tcp_port:
    name: Reader TCP port
    description: The UR4's command port (8888 unless you changed it).
  reading_mode:
    name: Reading mode
    description: >-
      door (default): the hub drives the reader in command mode from the door
      sensor (continuous while open, sweeps otherwise). continuous: the
      reader's auto mode pushes every read over UDP.
  reader_connection:
    name: Reader connection
    description: >-
      per_window (default): connect for each sweep or continuous window and
      disconnect afterwards. persistent: keep one connection open (ping every
      60 s, reconnect automatically).
  door_entity:
    name: Door sensor
    description: >-
      The pantry door contact, a binary_sensor (on = open). Required for
      reading_mode door.
  open_continuous_s:
    name: Read continuously after opening (s)
    description: How long to read continuously after the door opens.
  open_sweep_interval_s:
    name: Sweep interval while open (s)
    description: After the continuous window, sweep this often while the door stays open.
  sweep_s:
    name: Sweep length (s)
    description: How long one sweep reads.
  closed_sweep_interval_s:
    name: Sweep interval while closed (s)
    description: >-
      Sweep this often while the door is closed (also used while the door
      sensor is unavailable).
  depart_after_missed_sweeps:
    name: Depart after missed sweeps
    description: >-
      A present item departs after being missing from this many completed
      sweeps in a row.
  allowed_reader_ip:
    name: Allowed reader IP
    description: >-
      Only accept UDP reads from this IP. Leave empty to use the reader IP
      above.
  reader_tcp_probe:
    name: TCP probe
    description: >-
      Also ask the reader for its firmware version over TCP every minute, so
      it shows online even when no tags are being read.
  reader_offline_after_s:
    name: Reader offline after (s)
    description: Show the reader as offline after this long without a datagram.
  grocy_url:
    name: Grocy URL
    description: >-
      For the Grocy app use http://a0d7b954-grocy (enable the Grocy app's
      port first; see the Documentation tab).
  grocy_api_key:
    name: Grocy API key
    description: Grocy → Settings (wrench) → Manage API keys.
  grocy_location_id:
    name: Pantry location ID
    description: The ID of the "Pantry" location in Grocy.
  grocy_ui_url:
    name: Grocy browser URL
    description: >-
      Optional. Base URL your browser uses for Grocy, for links in the web UI.
  arrive_reads:
    name: Reads to arrive
    description: Reads needed within the arrival window before an item counts as arrived.
  arrive_window_s:
    name: Arrival window (s)
    description: Window for the reads above.
  depart_after_s:
    name: Depart after (s)
    description: Unseen this long means the item left the pantry.
  depart_requires_door_closed:
    name: Departures need a closed door
    description: >-
      reading_mode continuous only: count timer departures only while the
      door sensor reports closed.
  max_reader_power_dbm:
    name: Max reader power (dBm)
    description: >-
      Ceiling for reader power. 27 dBm with 8.3 dBi antennas stays within
      the FCC 36 dBm EIRP limit.
  log_level:
    name: Log level
    description: How much to log.
network:
  8888/udp: UR4 auto-mode tag reads (UDP). The reader sends to this host port.
